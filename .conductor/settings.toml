"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[[preview_urls]]
name = "Demo"
url = "http://localhost:$CONDUCTOR_PORT"

[[preview_urls]]
name = "Codebase"
url = "http://localhost:$((CONDUCTOR_PORT + 1))"

[scripts]
setup = "pnpm install --frozen-lockfile"
run_mode = "concurrent"

[scripts.run.checks]
command = "pnpm install --frozen-lockfile && pnpm check"
default = true
icon = "list-checks"

[scripts.run.demo]
command = "pnpm install --frozen-lockfile && pnpm run build:packages && pnpm --filter @foldworks/demo dev --host 0.0.0.0 --port ${CONDUCTOR_PORT:-5173}"
icon = "monitor"

[scripts.run.codebase]
command = "pnpm install --frozen-lockfile && pnpm --filter @foldworks/codebase build && node packages/codebase/dist/cli.js --host 0.0.0.0 --port $((${CONDUCTOR_PORT:-4309} + 1))"
icon = "book-open-code"

[scripts.run.verified-demo]
command = "pnpm install --frozen-lockfile && pnpm check && exec pnpm --filter @foldworks/demo dev --host 0.0.0.0 --port ${CONDUCTOR_PORT:-5173}"
icon = "shield-check"
