"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[[preview_urls]]
name = "Home page"
url = "http://localhost:$CONDUCTOR_PORT"

[[preview_urls]]
name = "Codebase"
url = "http://localhost:$((CONDUCTOR_PORT + 1))"

[scripts]
setup = "pnpm install --frozen-lockfile"
run_mode = "concurrent"

[scripts.run.checks]
command = "node scripts/ensure-dependencies.mjs && pnpm check"
default = true
icon = "list-checks"

[scripts.run.development]
command = "node scripts/ensure-dependencies.mjs && pnpm run build:packages && pnpm --filter @foldworks/demo dev --host 0.0.0.0 --port ${CONDUCTOR_PORT:-5173}"
icon = "globe"

[scripts.run.codebase]
command = "node scripts/ensure-dependencies.mjs && pnpm --filter @foldworks/codebase build && node packages/codebase/dist/cli.js --host 0.0.0.0 --port $((${CONDUCTOR_PORT:-4309} + 1))"
icon = "book-open-code"

[scripts.run.verified-development]
command = "node scripts/ensure-dependencies.mjs && pnpm check && exec pnpm --filter @foldworks/demo dev --host 0.0.0.0 --port ${CONDUCTOR_PORT:-5173}"
icon = "shield-check"
