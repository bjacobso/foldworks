name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate packages and demo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Run release checks
        run: pnpm release:check

      - name: Install visual-test browser
        run: pnpm --filter @foldworks/demo exec playwright install --with-deps chromium

      - name: Compare component screenshots
        run: pnpm --filter @foldworks/demo test:visual

      - name: Upload visual-test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-report
          path: |
            playwright-report/visual
            test-results/visual
          if-no-files-found: ignore
