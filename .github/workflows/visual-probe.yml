name: Visual renderer probe

# Temporary diagnostics for renderer parity. Runs only on pushes to the investigation branch.
on:
  push:
    branches:
      - conductor/polaris-font-renderer-mismatch

permissions:
  contents: read

jobs:
  probe:
    name: Probe renderer (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm --filter @foldworks/demo exec playwright install --with-deps chromium
      - name: Dump environment
        run: |
          mkdir -p probe-out
          bash apps/demo/visual/probe/environment.sh | tee probe-out/environment.txt
          echo "Renderer font fingerprint: $(bash apps/demo/visual/ubuntu-noble.sh --fingerprint --host)" | tee -a probe-out/environment.txt
      - name: Compare against committed baselines
        run: pnpm --filter @foldworks/demo test:visual
      - name: Capture every screenshot twice
        run: |
          pnpm --filter @foldworks/demo test:visual --update-snapshots=all
          cp -r apps/demo/visual/__screenshots__ probe-out/run1
          pnpm --filter @foldworks/demo test:visual --update-snapshots=all
          cp -r apps/demo/visual/__screenshots__ probe-out/run2
      - name: Report byte differences from committed baselines
        run: |
          git status --porcelain apps/demo/visual/__screenshots__ | tee probe-out/byte-diff.txt
          echo "$(wc -l < probe-out/byte-diff.txt) of 42 PNGs differ byte-wise from the committed baselines"
      - name: Probe platform fonts
        working-directory: apps/demo
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4175 --strictPort &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4175 >/dev/null && break; sleep 1; done
          node visual/probe/environment.mjs ../../probe-out/fonts.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renderer-probe-${{ matrix.shard }}
          path: probe-out
