<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig for visual tests, passed to Chromium via FONTCONFIG_FILE. Chromium bundles
  fontconfig and FreeType, so replacing the host's /etc/fonts with this file makes glyph
  selection and rasterization independent of the machine: only the pinned npm fonts
  below are visible, and render settings are explicit instead of distro defaults.
-->
<fontconfig>
  <dir prefix="relative">../node_modules/inter-font/ttf</dir>
  <dir prefix="relative">../node_modules/dejavu-fonts-ttf/ttf</dir>
  <cachedir prefix="xdg">foldworks-visual-fontconfig</cachedir>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
