<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Foldworks — polished application primitives for Foldkit and StyleX."
    />
    <script>
      (() => {
        const storageKey = "foldworks-demo-theme";
        const colorThemeStorageKey = "foldworks-demo-color-theme";
        let preference = "System";
        let colorTheme = "Neutral";
        try {
          const stored = window.localStorage.getItem(storageKey);
          const storedColorTheme = window.localStorage.getItem(colorThemeStorageKey);
          if (stored === "Light" || stored === "Dark" || stored === "System") {
            preference = stored;
          }
          if (storedColorTheme === "Neutral" || storedColorTheme === "Zinc" || storedColorTheme === "Blue") {
            colorTheme = storedColorTheme;
          }
        } catch {}
        const systemIsDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = preference === "Dark" ||
          (preference === "System" && systemIsDark);
        document.documentElement.dataset.theme = colorTheme.toLowerCase();
        document.documentElement.dataset.mode = isDark ? "dark" : "light";
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.dataset.themePreference = preference.toLowerCase();
      })();
    </script>
    <link href="/src/styles.css" rel="stylesheet" />
    <title>Foldworks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
